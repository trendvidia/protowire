// Fixture: 23_http_template_paths
// Exercises: the two `@http` path-template shapes beyond a bare
// `{name}` (RFC-001 §5.2, issue #217) — a dotted field path, and a
// variable constrained by a sub-path pattern.
//
// Expected behavior:
//   - `{shelf.id}` binds the `id` field of the top-level `shelf`
//     field's message. Segments name a field path *from the request
//     message's top level*; a component that names nothing, or that
//     descends through a scalar or a repeated field, is a compile
//     error (see the `invalid/http_*` fixtures).
//   - `{name=shelves/*}` binds the top-level `name` field and
//     constrains what it may match. The pattern is part of the routing
//     skeleton, so it reaches `google.api.http` verbatim.
//   - Both lower to the standard option unchanged: the carrier and the
//     `HttpRule` record the path exactly as written, patterns included.
//   - A REST-surface renderer normalises the OpenAPI *path key* to
//     `{name}` — OpenAPI's template grammar has no `{name=pattern}`
//     form — while a dotted variable carries through verbatim, since
//     OpenAPI parameter names admit dots. So the document's paths are
//     `/shelves/{shelf.id}` and `/named/{name}`.
//   - A nested binding takes its whole top-level container out of the
//     remaining-field binding: `shelf` contributes no query parameter
//     beside `{shelf.id}`. The renderer flattens no message anywhere,
//     so splitting one here would be a special case (issue #218).
//
// Compile + lowering only, so there is no report golden.

syntax = "proto3";

package fixtures.templates;

import "protowire/schema/v1/annotations.proto";

message Shelf {
  string id = 1;
  string display_name = 2;
}

message GetShelfRequest {
  Shelf shelf = 1;
  bool include_archived = 2;
}

message GetNamedRequest {
  string name = 1;
}

service Shelves {
  @http("GET", "/shelves/{shelf.id}")
  rpc GetShelf(GetShelfRequest) returns (Shelf);

  @http("GET", "/named/{name=shelves/*}")
  rpc GetNamed(GetNamedRequest) returns (Shelf);
}
