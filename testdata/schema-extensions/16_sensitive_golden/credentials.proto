// Fixture: 16_sensitive_golden
// Exercises: @sensitive report redaction (§6.7, issue #90) at all three
// attachment sites — a type alias (macro-expands to consuming fields),
// a field, and a message (every field transitively sensitive) — plus a
// non-sensitive control field.
//
// Expected behavior: see ../16_sensitive_golden.textproto — for every
// violation on a sensitive field the engine MUST leave actual_value
// unset and set value_redacted = true (distinguishable from three-state
// absence, §6.7 rule 2); the control field's violation carries its
// actual_value verbatim.

syntax = "proto3";

package fixtures.sensitive;

import "protowire/schema/v1/annotations.proto";

// Sensitivity via the type alias: every consuming field is sensitive.
type ApiKey = string
  @sensitive
  @validate(this.size() == 32,
            code = "auth.key.length",
            message = "API key must be 32 characters");

// Sensitivity via the message: all fields, transitively through
// message-typed fields.
@sensitive
message OAuthToken {
  string access = 1
    @validate(this.size() >= 10,
              code = "auth.token.short",
              message = "access token too short");
}

message Credentials {
  ApiKey api_key = 1;

  // Sensitivity via the field-level annotation.
  string password = 2
    @sensitive
    @validate(this.size() >= 12,
              code = "auth.password.short",
              message = "password too short");

  // Control: NOT sensitive — its violation carries the actual value.
  string username = 3
    @validate(this.size() >= 5,
              code = "auth.username.short",
              message = "username too short");

  OAuthToken token = 4;
}
