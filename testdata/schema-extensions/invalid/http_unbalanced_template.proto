//
// Invalid fixture: http-unbalanced-template
// Violates: RFC-001 §5.2 — every `{` in an `@http` path opens a
// template segment and must be closed by a `}`. An unclosed brace is
// not a literal path character: it names a variable the lowering can
// neither bind nor check, so the rule is unservable (issue #213).

syntax = "proto3";

package fixtures.badhttpbrace;

import "protowire/schema/v1/annotations.proto";

message GetOrderRequest {
  string order_id = 1;
}

message Order {
  string order_id = 1;
}

service Orders {
  // ERROR: the `{` opened at `{order_id` is never closed.
  @http("GET", "/orders/{order_id")
  rpc GetOrder(GetOrderRequest) returns (Order);
}
