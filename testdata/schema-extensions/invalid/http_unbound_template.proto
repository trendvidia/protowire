//
// Invalid fixture: http-unbound-template
// Violates: RFC-001 §5.2 — every `{name}` segment of an `@http` path
// binds a field of the request message. The skeleton lowers to a
// standard `google.api.http` rule, so a segment that binds nothing is
// a route that 404s in every REST binder while the schema and the
// generated OpenAPI document both promise it (issue #213).

syntax = "proto3";

package fixtures.badhttp;

import "protowire/schema/v1/annotations.proto";

message GetOrderRequest {
  string order_id = 1;
}

message Order {
  string order_id = 1;
}

service Orders {
  // ERROR: the request message has `order_id`, not `orderId`; the
  // template binds nothing.
  @http("GET", "/orders/{orderId}")
  rpc GetOrder(GetOrderRequest) returns (Order);
}
