#
# The PXF text each port writes, against goldens protowire-go wrote (#503). Like
# the other cross-port gates this reads the ports at their default branches, so
# it runs daily as well as on the paths that change it. REQUIRE_PORTS fails the
# job if a port stops building, so a lost harness can't pass for a clean run.

name: Cross-port text check

on:
  pull_request:
    paths:
      - 'testdata/text/**'
      - 'scripts/cross_text_check.sh'
      - '.github/workflows/cross-port-text-check.yml'
  push:
    branches: [main]
    paths:
      - 'testdata/text/**'
      - 'scripts/cross_text_check.sh'
      - '.github/workflows/cross-port-text-check.yml'
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-port-text-${{ github.ref }}
  cancel-in-progress: true

jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protowire
        uses: actions/checkout@v7
        with:
          path: protowire
      - name: Checkout protowire-go
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-go
          path: protowire-go
      - name: Checkout protowire-cpp
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-cpp
          path: protowire-cpp
      - name: Checkout protowire-java
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-java
          path: protowire-java
      - name: Install the C++ toolchain and protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build protobuf-compiler libprotobuf-dev libprotoc-dev
      - name: Checkout protowire-dart
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-dart
          path: protowire-dart
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Checkout protowire-csharp
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-csharp
          path: protowire-csharp
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v7
        with:
          go-version-file: protowire-go/go.mod
          cache-dependency-path: protowire-go/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Caches the Gradle distribution that protowire-java's wrapper would
      # otherwise download on every run (#592).
      - uses: gradle/actions/setup-gradle@v6
      - name: Checkout protowire-rust
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-rust
          path: protowire-rust
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: protowire-rust
      - name: Checkout protowire-python
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-python
          path: protowire-python
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # The harness runs from the port's .venv. The extension builds against
      # the protowire-cpp checkout beside it, which CMakeLists.txt looks for by
      # default, so Python is checked at cpp's default branch, as cpp is.
      - name: Build protowire-python
        run: |
          python -m venv protowire-python/.venv
          protowire-python/.venv/bin/pip install --quiet ./protowire-python
      - name: Text conformance
        env:
          REQUIRE_PORTS: 'go,cpp,java,java-lite,csharp,dart,rust,python'
        run: ./protowire/scripts/cross_text_check.sh
