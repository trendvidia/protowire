#
# HARDENING conformance corpus across ports (docs/HARDENING.md § Conformance
# corpus, issue #303). Like cross-port-envelope-check.yml this reads the
# ports at their default branches, which is why it runs on a daily schedule
# as well as on the paths that change the corpus: a regression pushed to a
# port is otherwise invisible here until someone runs the harness by hand,
# which is how nine failing rows on the C++ port went unnoticed
# (trendvidia/protowire-cpp#26).
#
# The four ports the envelope gate builds are checked out here, with Swift and
# Python; Rust, Dart and C# are exercised by the same script locally. All four run,
# TypeScript since its check-decode harness came back
# (trendvidia/protowire-typescript#55). REQUIRE_PORTS fails the job if any one
# stops building, so a missing harness can't pass for a clean run (#421). A
# port with known failing rows can go in SKIP_PORTS until its fix lands; none
# is skipped. java-lite is the Java lite tier, built from the same
# checkout.

name: Cross-port security check

on:
  pull_request:
    paths:
      - 'testdata/adversarial/**'
      - 'scripts/cross_security_check.sh'
      - '.github/workflows/cross-port-security-check.yml'
  push:
    branches: [main]
    paths:
      - 'testdata/adversarial/**'
      - 'scripts/cross_security_check.sh'
      - '.github/workflows/cross-port-security-check.yml'
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-port-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout protowire
        uses: actions/checkout@v7
        with:
          path: protowire
      - name: Checkout protowire-go
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-go
          path: protowire-go
      - name: Checkout protowire-cpp
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-cpp
          path: protowire-cpp
      - name: Checkout protowire-typescript
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-typescript
          path: protowire-typescript
      - name: Install protowire-typescript dependencies
        run: npm ci
        working-directory: protowire-typescript
      - name: Checkout protowire-java
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-java
          path: protowire-java
      - name: Checkout protowire-swift
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-swift
          path: protowire-swift
      - name: Swift toolchain
        run: swift --version
      - uses: actions/setup-go@v7
        with:
          go-version-file: protowire-go/go.mod
          cache-dependency-path: protowire-go/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install C++ build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build protobuf-compiler libprotobuf-dev libprotoc-dev
      - name: Checkout protowire-python
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-python
          path: protowire-python
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # The harness runs from the port's .venv. The extension builds against
      # the protowire-cpp checkout beside it, which CMakeLists.txt looks for by
      # default, so Python is checked at cpp's default branch, as cpp is.
      - name: Build protowire-python
        run: |
          python -m venv protowire-python/.venv
          protowire-python/.venv/bin/pip install --quiet ./protowire-python
      - name: HARDENING conformance corpus
        env:
          REQUIRE_PORTS: 'go,cpp,java,java-lite,ts,swift,python'
        run: ./protowire/scripts/cross_security_check.sh
