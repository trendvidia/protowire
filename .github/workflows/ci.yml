name: CI

# Base build/test workflow for the canonical CLI and codegen plugins.
# Cross-port wire-equivalence and HARDENING conformance jobs are tracked
# separately in ROADMAP.md (M1, M8) and will be re-introduced once the
# Steward governance integration is finalised.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Vendored-copy drift check (#243). The canonical .proto files under
  # proto/ are hand-copied into every port; nothing else verifies the
  # copies, and (pxf.key) was missing from ten of eleven when this landed.
  #
  # Runs in SOURCE=remote so it needs no sibling checkouts: each copy is
  # fetched from GitHub at HEAD. The private consumers (protolsp,
  # chameleon, steward, org-protowire) are SKIPped here — GITHUB_TOKEN
  # does not reach them — so this gates the seven public ports, and a
  # local run before a release covers the rest.
  annotation-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cross-repo annotation surface
        env:
          SOURCE: remote
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/cross_annotation_check.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  # The RFC-001 §9.3 round-trip test (#144) lives in a nested test-only
  # module so its heavyweight test-only deps (protocompile, protocheck)
  # stay off the public protowire module graph. All of them are public —
  # no credentials, no GOPRIVATE.
  roundtrip:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/schemaext
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: internal/schemaext/go.mod
          cache-dependency-path: internal/schemaext/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...
