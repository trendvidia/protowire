name: CI

# Base build/test workflow for the canonical CLI and codegen plugins.
# Cross-port wire-equivalence and HARDENING conformance jobs are tracked
# separately in ROADMAP.md (M1, M8) and will be re-introduced once the
# Steward governance integration is finalised.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  # The RFC-001 round-trip test (#144) lives in a nested test-only module
  # so its private dependencies (protocompile, protocheck, and protocheck's
  # transitive govm) stay off the public protowire module graph. It runs as
  # its own job with the org's private-module PAT pattern (same as
  # protocheck's CI).
  roundtrip:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/trendvidia/protocheck,github.com/trendvidia/protocompile,github.com/trendvidia/govm
    defaults:
      run:
        working-directory: internal/schemaext
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: internal/schemaext/go.mod
          cache-dependency-path: internal/schemaext/go.sum

      - name: Configure access to private trendvidia modules
        env:
          TRENDVIDIA_MODULES_PAT: ${{ secrets.TRENDVIDIA_MODULES_PAT }}
        run: |
          if [ -z "$TRENDVIDIA_MODULES_PAT" ]; then
            echo "::error::Repository secret TRENDVIDIA_MODULES_PAT is not set."
            echo "::error::Create a fine-grained PAT with Contents:Read on trendvidia/protocheck, trendvidia/protocompile, and trendvidia/govm, and add it as TRENDVIDIA_MODULES_PAT in repo settings → Secrets and variables → Actions."
            exit 1
          fi
          for repo in protocheck protocompile govm; do
            git config --global url."https://x-access-token:${TRENDVIDIA_MODULES_PAT}@github.com/trendvidia/${repo}".insteadOf "https://github.com/trendvidia/${repo}"
          done

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...
