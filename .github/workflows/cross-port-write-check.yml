#
# The PB bytes each port writes from PXF text, against goldens protowire-go
# wrote (#509). Like the other cross-port gates this reads the ports at their
# default branches, so it runs daily as well as on the paths that change it.
# REQUIRE_PORTS fails the job if a port stops building, so a lost harness can't
# pass for a clean run.
#
# Java and its lite tier are skipped here until they write Go's bytes: on the
# first run they differed on 20 pairs, filed as trendvidia/protowire-java#156,
# #157 and #158. Drop the SKIP_PORTS line and add them to REQUIRE_PORTS when
# those close.

name: Cross-port write check

on:
  pull_request:
    paths:
      - 'testdata/text/**'
      - 'testdata/write/**'
      - 'scripts/cross_write_check.sh'
      - '.github/workflows/cross-port-write-check.yml'
  push:
    branches: [main]
    paths:
      - 'testdata/text/**'
      - 'testdata/write/**'
      - 'scripts/cross_write_check.sh'
      - '.github/workflows/cross-port-write-check.yml'
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-port-write-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protowire
        uses: actions/checkout@v7
        with:
          path: protowire
      - name: Checkout protowire-go
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-go
          path: protowire-go
      - name: Checkout protowire-java
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-java
          path: protowire-java
      - uses: actions/setup-go@v7
        with:
          go-version-file: protowire-go/go.mod
          cache-dependency-path: protowire-go/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Write conformance
        env:
          REQUIRE_PORTS: 'go'
          SKIP_PORTS: 'java,java-lite'
        run: ./protowire/scripts/cross_write_check.sh
