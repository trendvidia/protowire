#
# The PB bytes each port writes from PXF text, against goldens protowire-go
# wrote (#509). Like the other cross-port gates this reads the ports at their
# default branches, so it runs daily as well as on the paths that change it.
# REQUIRE_PORTS fails the job if a port stops building, so a lost harness can't
# pass for a clean run.
#
# Java and its lite tier write Go's bytes since trendvidia/protowire-java#172,
# so they are required too. C# runs with the cases trendvidia/protowire-csharp#91
# waits on excluded in the script. Dart runs every case but Scalars.enum-unknown,
# excluded in the script until trendvidia/protowire-dart#82 is decided.
# Rust runs every case but Scalars.float-negzero, excluded in the script until
# trendvidia/protowire-rust#98 is fixed. TypeScript is required too, since its
# harness has the mode (trendvidia/protowire-typescript#98).

name: Cross-port write check

on:
  pull_request:
    paths:
      - 'testdata/text/**'
      - 'testdata/write/**'
      - 'scripts/cross_write_check.sh'
      - '.github/workflows/cross-port-write-check.yml'
  push:
    branches: [main]
    paths:
      - 'testdata/text/**'
      - 'testdata/write/**'
      - 'scripts/cross_write_check.sh'
      - '.github/workflows/cross-port-write-check.yml'
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-port-write-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protowire
        uses: actions/checkout@v7
        with:
          path: protowire
      - name: Checkout protowire-go
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-go
          path: protowire-go
      - name: Checkout protowire-cpp
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-cpp
          path: protowire-cpp
      - name: Checkout protowire-java
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-java
          path: protowire-java
      - name: Checkout protowire-csharp
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-csharp
          path: protowire-csharp
      - name: Checkout protowire-dart
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-dart
          path: protowire-dart
      - name: Install the C++ toolchain and protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build protobuf-compiler libprotobuf-dev libprotoc-dev
      - name: Checkout protowire-typescript
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-typescript
          path: protowire-typescript
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install protowire-typescript dependencies
        run: npm ci
        working-directory: protowire-typescript
      - name: Checkout protowire-rust
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-rust
          path: protowire-rust
      - name: Checkout protowire-swift
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-swift
          path: protowire-swift
      - name: Swift toolchain
        run: swift --version
      - uses: actions/setup-go@v7
        with:
          go-version-file: protowire-go/go.mod
          cache-dependency-path: protowire-go/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: protowire-rust
      - name: Checkout protowire-python
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-python
          path: protowire-python
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # The harness runs from the port's .venv. The extension builds against
      # the protowire-cpp checkout beside it, which CMakeLists.txt looks for by
      # default, so Python is checked at cpp's default branch, as cpp is.
      - name: Build protowire-python
        run: |
          python -m venv protowire-python/.venv
          protowire-python/.venv/bin/pip install --quiet ./protowire-python
      - name: Write conformance
        env:
          REQUIRE_PORTS: 'go,cpp,java,java-lite,csharp,rust,dart,ts,swift,python'
        run: ./protowire/scripts/cross_write_check.sh
