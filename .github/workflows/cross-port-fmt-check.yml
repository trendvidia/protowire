#
# The text each port's document formatter writes, against goldens protowire-go
# wrote (#584). Like the other cross-port gates this reads the ports at their
# default branches, so it runs daily as well as on the paths that change it.
# REQUIRE_PORTS fails the job if a port stops building or its harness loses the
# pxf-fmt mode, so a lost harness can't pass for a clean run. Python has no
# document formatter.

name: Cross-port format check

on:
  pull_request:
    paths:
      - 'testdata/text/**'
      - 'testdata/fmt/documents/**'
      - 'scripts/cross_fmt_check.sh'
      - '.github/workflows/cross-port-fmt-check.yml'
  push:
    branches: [main]
    paths:
      - 'testdata/text/**'
      - 'testdata/fmt/documents/**'
      - 'scripts/cross_fmt_check.sh'
      - '.github/workflows/cross-port-fmt-check.yml'
  schedule:
    - cron: '45 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-port-fmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protowire
        uses: actions/checkout@v7
        with:
          path: protowire
      - name: Checkout protowire-go
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-go
          path: protowire-go
      - name: Checkout protowire-cpp
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-cpp
          path: protowire-cpp
      - name: Checkout protowire-java
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-java
          path: protowire-java
      - name: Checkout protowire-csharp
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-csharp
          path: protowire-csharp
      - name: Checkout protowire-dart
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-dart
          path: protowire-dart
      - name: Install the C++ toolchain and protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build protobuf-compiler libprotobuf-dev libprotoc-dev
      - name: Checkout protowire-typescript
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-typescript
          path: protowire-typescript
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install protowire-typescript dependencies
        run: npm ci
        working-directory: protowire-typescript
      - name: Checkout protowire-rust
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-rust
          path: protowire-rust
      - name: Checkout protowire-swift
        uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-swift
          path: protowire-swift
      - name: Swift toolchain
        run: swift --version
      - uses: actions/setup-go@v7
        with:
          go-version-file: protowire-go/go.mod
          cache-dependency-path: protowire-go/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Caches the Gradle distribution that protowire-java's wrapper would
      # otherwise download on every run (#592).
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: protowire-rust
      - name: Format conformance
        env:
          REQUIRE_PORTS: 'go,cpp,java,java-lite,csharp,rust,dart,ts,swift'
        run: ./protowire/scripts/cross_fmt_check.sh
