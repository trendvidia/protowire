name: CodeQL

# Static-analysis SAST for Go (the canonical CLI), Kotlin (the
# JetBrains plugin's startup activity / annotator), and TypeScript (the
# VS Code extension). The protowire-java parser jar bundled by the
# JetBrains plugin is owned by protowire-java; CodeQL there is run in
# that repo, not here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan to catch newly-disclosed CodeQL queries firing on
    # unchanged code.
    - cron: "37 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle distribution the plugin's wrapper would otherwise
      # download on every run (#592).
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6

      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - if: matrix.language == 'go'
        run: go build ./...

      - if: matrix.language == 'java-kotlin'
        working-directory: editors/jetbrains/plugin
        # The plugin sets org.gradle.caching=true. Classes restored from the
        # build cache are never compiled, and CodeQL then has nothing to
        # analyse, so the build cache stays off here.
        run: ./gradlew --quiet --no-build-cache classes

      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
